<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>包台酒业 · 十三香蜜酿</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Songti SC", "STSong", "SimSun", serif;
    background: #0a1f3c;
    color: #e8dcc0;
    line-height: 1.8;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 28px; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 26px 0; border-bottom: 1px solid rgba(201,169,97,.35);
  }
  .brand { font-size: 22px; letter-spacing: .4em; color: #d4af5f; }
  .brand small { display: block; font-size: 10px; letter-spacing: .3em; color: #9fb0c8; margin-top: 4px; }
  nav { font-size: 13px; letter-spacing: .2em; color: #9fb0c8; }
  nav span { margin-left: 28px; }
  .hero { text-align: center; padding: 96px 0 80px; position: relative; }
  .hero .eyebrow { font-size: 13px; letter-spacing: .6em; color: #c9a961; margin-bottom: 26px; }
  .hero h1 { font-size: 62px; letter-spacing: .25em; color: #f0e2bd; font-weight: normal; }
  .hero .sub { font-size: 20px; letter-spacing: .35em; color: #d4af5f; margin-top: 20px; }
  .spec { margin-top: 44px; display: inline-flex; gap: 0; border-top: 1px solid rgba(201,169,97,.4); border-bottom: 1px solid rgba(201,169,97,.4); }
  .spec div { padding: 18px 46px; border-right: 1px solid rgba(201,169,97,.25); }
  .spec div:last-child { border-right: none; }
  .spec b { display: block; font-size: 26px; color: #f0e2bd; font-weight: normal; }
  .spec i { font-style: normal; font-size: 12px; letter-spacing: .2em; color: #9fb0c8; }
  .section { padding: 70px 0; border-top: 1px solid rgba(201,169,97,.2); }
  .section h2 { font-size: 28px; letter-spacing: .3em; color: #d4af5f; font-weight: normal; text-align: center; margin-bottom: 40px; }
  .cols { display: flex; gap: 40px; text-align: center; }
  .cols > div { flex: 1; padding: 30px 20px; border: 1px solid rgba(201,169,97,.25); }
  .cols h3 { font-size: 20px; color: #f0e2bd; letter-spacing: .2em; font-weight: normal; margin-bottom: 14px; }
  .cols p { font-size: 14px; color: #b9c4d4; }
  footer { text-align: center; padding: 40px 0 60px; font-size: 12px; letter-spacing: .2em; color: #7d8ca3; border-top: 1px solid rgba(201,169,97,.2); }
  @media (max-width: 700px) {
    .hero h1 { font-size: 40px; }
    .cols { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">包台酒业<small>BAOTAI LIQUOR</small></div>
    <nav><span>品牌</span><span>产品</span><span>酿造</span><span>联系</span></nav>
  </header>

  <section class="hero">
    <div class="eyebrow">高端白酒 · 蜜香型</div>
    <h1>十三香蜜酿</h1>
    <div class="sub">一酿藏十三香</div>
    <div class="spec">
      <div><b>53%VOL</b><i>酒精度</i></div>
      <div><b>500ML</b><i>净含量</i></div>
      <div><b>蜜香型</b><i>白酒香型</i></div>
    </div>
  </section>

  <section class="section">
    <h2>蜜香自成一类</h2>
    <div class="cols">
      <div>
        <h3>第十三种香型</h3>
        <p>蜜香型是我国第十三种白酒香型，自成一格，独具风味。</p>
      </div>
      <div>
        <h3>蜜香幽雅</h3>
        <p>以蜜香为主调，香气幽雅协调，入口绵柔，余味回甘。</p>
      </div>
      <div>
        <h3>十三香之和</h3>
        <p>诸香交融而又层次分明，成就「十三香蜜酿」的独特气质。</p>
      </div>
    </div>
  </section>

  <footer>包台酒业 · 十三香蜜酿 &nbsp;|&nbsp; 53%VOL · 500ML · 蜜香型</footer>
</div>
</body>
</html>
